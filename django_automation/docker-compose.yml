# docker-compose.yml
version: '3.8'

services:
  django:
    build: .
    container_name: django_app
    command: ["/code/entrypoint.sh"]
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - appnet

  celery:
    build: .
    container_name: celery_worker
    command: ["/code/celery_worker.sh"]
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/code/static
    ports:
      - "80:80"
    depends_on:
      - django
    networks:
      - appnet

volumes:
  static_volume:

networks:
  appnet:
    driver: bridge
