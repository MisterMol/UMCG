<h4 class="mb-4 text-primary"><i class="fas fa-user-lock me-2"></i>Vodafone Inloggen</h4>

<form method="post" id="loginForm" class="needs-validation" novalidate>
    {% csrf_token %}
    <div class="mb-3">
        <label for="username" class="form-label">Gebruikersnaam</label>
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div class="invalid-feedback">Vul je gebruikersnaam in.</div>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Wachtwoord</label>
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="invalid-feedback">Wachtwoord is verplicht.</div>
    </div>
    <input type="text" name="zoeknummer" class="form-control mt-4 mb-4" placeholder="Voer mobiel nummer in" required>
    <button class="btn btn-primary w-100" type="submit">
        <i class="fas fa-sign-in-alt me-2"></i>Inloggen
    </button>
</form>

<div id="loginResult" class="mt-3"></div>
